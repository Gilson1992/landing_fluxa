services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fluxa
      POSTGRES_PASSWORD: fluxa
      POSTGRES_DB: fluxa
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - fluxa_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql://fluxa:fluxa@postgres:5432/fluxa
      PORT: 3000
      NODE_ENV: development
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fluxa_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - fluxa_internal

volumes:
  postgres_dev_data:
  backend_node_modules:
  frontend_node_modules:

networks:
  fluxa_internal:
    internal: true
